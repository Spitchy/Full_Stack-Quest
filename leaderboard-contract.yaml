openapi: 3.1.0
info:
  title: Hub — Classement
  version: 1.0.0

paths:
  /api/v1/leaderboard:
    get:
      summary: Classement des joueurs
      security: [{ playerToken: [] }]
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [season, today], default: season }
          description: >
            season = Expérience cumulée sur la saison en cours.
            today = Expérience gagnée aujourd'hui (journée Europe/Paris).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: >
            Tri fixe : xp décroissant, puis pseudo croissant.
            Égalités : même xp = même rang, le suivant saute (1, 1, 3).
            Joueur sans partie : inclus, xp = 0, classé normalement.
            Page au-delà de la fin : 200 avec items vide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaderboardPage" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    playerToken: { type: http, scheme: bearer }

  schemas:
    LeaderboardPage:
      type: object
      additionalProperties: false
      required: [period, page, pageSize, total, items]
      properties:
        period:   { type: string, enum: [season, today] }
        page:     { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:    { type: integer, minimum: 0, description: Nombre total de joueurs classés }
        items:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, playerId, pseudo, team, level, xp]
      properties:
        rank:     { type: integer, minimum: 1 }
        playerId: { type: string, pattern: "^p_[0-9]+$" }
        pseudo:   { type: string, minLength: 1 }
        team:
          type: [string, "null"]
          description: null si le joueur n'a pas d'équipe (affiché « — »)
        level:    { type: integer, minimum: 1 }
        xp:       { type: integer, minimum: 0 }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }

  responses:
    InvalidQuery:
      description: period inconnu, page ou pageSize hors bornes ou pas un entier
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidToken:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Trop de requêtes
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
